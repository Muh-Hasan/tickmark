model_list:
  - model_name: local-main
    litellm_params: { model: ollama_chat/qwen3:4b-instruct, api_base: http://host.docker.internal:11434, num_ctx: 8192 }
  - model_name: local-vision
    litellm_params: { model: ollama_chat/qwen2.5vl:3b, api_base: http://host.docker.internal:11434, num_ctx: 8192 }
  - model_name: local-embed
    litellm_params: { model: ollama/nomic-embed-text, api_base: http://host.docker.internal:11434, drop_params: true }
  - model_name: cloud-lite
    litellm_params: { model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_API_KEY, rpm: 10 }
  - model_name: cloud-strong
    litellm_params: { model: gemini/gemini-3.8-flash, api_key: os.environ/GEMINI_API_KEY, rpm: 5 }
  - model_name: cloud-backup
    litellm_params: { model: openrouter/google/gemma-4-31b-it:free, api_key: os.environ/OPENROUTER_API_KEY, rpm: 15 }
  - model_name: chaos
    litellm_params: { model: openai/chaos, api_base: http://chaos:8000/v1, api_key: none }
litellm_settings:
  callbacks: ledger_callback.ledger
  cache: true
  cache_params: { type: local }
router_settings:
  num_retries: 2
  cooldown_time: 60
  fallbacks: [{ cloud-strong: [cloud-lite] }, { cloud-lite: [cloud-backup] }, { chaos: [local-main] }]
